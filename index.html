<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <style>
      :root {
        --bg: #f3f4f6;
        --panel: #ffffff;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --danger: #dc2626;
        --text: #111827;
        --muted: #6b7280;
        --border: #d1d5db;
        --success: #16a34a;
        --success-soft: #dcfce7;
        --shadow: rgba(15, 23, 42, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 3rem);
      }

      .new-book-btn,
      .remove-btn,
      .toggle-btn,
      .submit-btn,
      .cancel-btn {
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        transition:
          transform 0.15s ease,
          opacity 0.15s ease;
      }

      .new-book-btn:hover,
      .remove-btn:hover,
      .toggle-btn:hover,
      .submit-btn:hover,
      .cancel-btn:hover {
        transform: translateY(-1px);
      }

      .new-book-btn {
        background: var(--primary);
        color: white;
        padding: 12px 18px;
        font-weight: 700;
      }

      .new-book-btn:hover {
        background: var(--primary-dark);
      }

      .library {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
      }

      .book-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 8px 20px var(--shadow);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .book-card h2 {
        margin: 0;
        font-size: 1.4rem;
      }

      .book-card p {
        margin: 0;
        color: var(--muted);
      }

      .book-meta {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .status {
        display: inline-block;
        align-self: flex-start;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .status.read {
        background: var(--success-soft);
        color: #166534;
      }

      .status.unread {
        background: #fef2f2;
        color: #991b1b;
      }

      .card-actions {
        display: flex;
        gap: 10px;
        margin-top: auto;
      }

      .toggle-btn {
        flex: 1;
        background: #e5e7eb;
        color: var(--text);
        padding: 10px 12px;
        font-weight: 600;
      }

      .remove-btn {
        background: var(--danger);
        color: #fff;
        padding: 10px 12px;
        font-weight: 600;
      }

      dialog {
        border: none;
        border-radius: 16px;
        padding: 0;
        width: min(92vw, 480px);
        box-shadow: 0 16px 32px rgba(15, 23, 42, 0.22);
      }

      dialog::backdrop {
        background: rgba(15, 23, 42, 0.5);
      }

      .modal-content {
        padding: 22px;
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .modal-header h2 {
        margin: 0;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      label {
        font-weight: 700;
      }

      input[type="text"],
      input[type="number"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 1rem;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-top: 4px;
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
      }

      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 8px;
      }

      .cancel-btn,
      .submit-btn {
        padding: 10px 16px;
        font-weight: 700;
      }

      .cancel-btn {
        background: #e5e7eb;
        color: var(--text);
      }

      .submit-btn {
        background: var(--success);
        color: white;
      }

      .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        background: rgba(255, 255, 255, 0.7);
        border: 1px dashed var(--border);
        border-radius: 12px;
        padding: 30px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Library</h1>
        <button class="new-book-btn" id="newBookBtn" type="button">
          + New Book
        </button>
      </header>

      <main class="library" id="library"></main>
    </div>

    <dialog id="bookDialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Add a new book</h2>
          <button class="cancel-btn" type="button" id="closeDialogBtn">
            Close
          </button>
        </div>

        <form id="bookForm">
          <div class="field">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" required />
          </div>

          <div class="field">
            <label for="author">Author</label>
            <input id="author" name="author" type="text" required />
          </div>

          <div class="field">
            <label for="pages">Pages</label>
            <input id="pages" name="pages" type="number" min="1" required />
          </div>

          <div class="checkbox-row">
            <input id="read" name="read" type="checkbox" />
            <label for="read">Read</label>
          </div>

          <div class="form-actions">
            <button class="cancel-btn" type="button" id="cancelFormBtn">
              Cancel
            </button>
            <button class="submit-btn" type="submit">Add Book</button>
          </div>
        </form>
      </div>
    </dialog>

    <script>
      const myLibrary = [];

      function Book(title, author, pages, read) {
        this.id = crypto.randomUUID();
        this.title = title;
        this.author = author;
        this.pages = pages;
        this.read = read;
      }

      Book.prototype.toggleRead = function () {
        this.read = !this.read;
      };

      function addBookToLibrary(book) {
        myLibrary.push(book);
        renderLibrary();
      }

      function createBook(title, author, pages, read) {
        const book = new Book(title, author, pages, read);
        addBookToLibrary(book);
        return book;
      }

      function renderLibrary() {
        const library = document.querySelector("#library");
        library.innerHTML = "";

        if (myLibrary.length === 0) {
          const emptyState = document.createElement("div");
          emptyState.className = "empty-state";
          emptyState.textContent =
            "Your library is empty. Add your first book!";
          library.appendChild(emptyState);
          return;
        }

        myLibrary.forEach((book) => {
          const card = document.createElement("article");
          card.className = "book-card";
          card.dataset.id = book.id;

          const title = document.createElement("h2");
          title.textContent = book.title;

          const author = document.createElement("p");
          author.textContent = `by ${book.author}`;

          const meta = document.createElement("div");
          meta.className = "book-meta";

          const pages = document.createElement("p");
          pages.textContent = `${book.pages} pages`;

          const status = document.createElement("span");
          status.className = `status ${book.read ? "read" : "unread"}`;
          status.textContent = book.read ? "Read" : "Not read";

          const actions = document.createElement("div");
          actions.className = "card-actions";

          const toggleBtn = document.createElement("button");
          toggleBtn.type = "button";
          toggleBtn.className = "toggle-btn";
          toggleBtn.textContent = book.read ? "Mark unread" : "Mark read";
          toggleBtn.addEventListener("click", () => {
            book.toggleRead();
            renderLibrary();
          });

          const removeBtn = document.createElement("button");
          removeBtn.type = "button";
          removeBtn.className = "remove-btn";
          removeBtn.textContent = "Remove";
          removeBtn.addEventListener("click", () => {
            const index = myLibrary.findIndex((item) => item.id === book.id);
            if (index !== -1) {
              myLibrary.splice(index, 1);
              renderLibrary();
            }
          });

          actions.append(toggleBtn, removeBtn);
          meta.append(pages, status);
          card.append(title, author, meta, actions);
          library.appendChild(card);
        });
      }

      const dialog = document.querySelector("#bookDialog");
      const newBookBtn = document.querySelector("#newBookBtn");
      const closeDialogBtn = document.querySelector("#closeDialogBtn");
      const cancelFormBtn = document.querySelector("#cancelFormBtn");
      const bookForm = document.querySelector("#bookForm");

      newBookBtn.addEventListener("click", () => {
        dialog.showModal();
      });

      function closeDialog() {
        dialog.close();
        bookForm.reset();
      }

      closeDialogBtn.addEventListener("click", closeDialog);
      cancelFormBtn.addEventListener("click", closeDialog);

      bookForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const title = document.querySelector("#title").value.trim();
        const author = document.querySelector("#author").value.trim();
        const pages = Number(document.querySelector("#pages").value);
        const read = document.querySelector("#read").checked;

        if (!title || !author || !pages || pages <= 0) {
          return;
        }

        createBook(title, author, pages, read);
        closeDialog();
      });

      createBook("The Hobbit", "J.R.R. Tolkien", 310, true);
      createBook("Pride and Prejudice", "Jane Austen", 432, false);
      createBook("The Alchemist", "Paulo Coelho", 208, true);
    </script>
  </body>
</html>
