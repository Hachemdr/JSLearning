<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Library</h1>
        <button class="new-book-btn" id="newBookBtn" type="button">
          + New Book
        </button>
      </header>

      <main class="library" id="library"></main>
    </div>

    <dialog id="bookDialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Add a new book</h2>
          <button class="cancel-btn" type="button" id="closeDialogBtn">
            Close
          </button>
        </div>

        <form id="bookForm">
          <div class="field">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" required />
          </div>

          <div class="field">
            <label for="author">Author</label>
            <input id="author" name="author" type="text" required />
          </div>

          <div class="field">
            <label for="pages">Pages</label>
            <input id="pages" name="pages" type="number" min="1" required />
          </div>

          <div class="checkbox-row">
            <input id="read" name="read" type="checkbox" />
            <label for="read">Read</label>
          </div>

          <div class="form-actions">
            <button class="cancel-btn" type="button" id="cancelFormBtn">
              Cancel
            </button>
            <button class="submit-btn" type="submit">Add Book</button>
          </div>
        </form>
      </div>
    </dialog>

    <script src="index.js"></script>
  </body>
</html>
